project = "agent-hub"
gitlab = "ai-tooling/agent-hub"
framework = "nextjs"
root_directory = "apps/hub"
node = "24.x"
domains = ["rc-agent-hub.vercel.app"]
env_sync_job = "vercel-env-sync"

[tokens]
deploy = "vercel_token"
preview = "vercel_preview_token"

[vault]
path = "secret/ai-tools/prod/agent-hub"
generate = ["service_tokens", "eve_jwt_secret", "cron_secret"]
bypass = "vercel_bypass"

[vault.copy]
"secret/ai-tools/prod/investigator-agent" = ["service_token", "semantic_engine_token"]

[[stores]]
kind = "neon"
name = "neon-investigator"

[[stores]]
kind = "edge-config"
name = "ai-platform-flags"
[stores.items]
kill = { investigate = false }
require_ctx = false
jobs = { churn_report = { live = false }, churn_chat = { live = false }, churn_suggestions = { live = false } }
