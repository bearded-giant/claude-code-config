# ai-platform hub (apps/hub in RechargePayments/ai-platform); GitHub Actions deploys, so no gitlab key:
# the deploy tokens are minted with `vbs.py token agent-hub --vault secret/ai-tools/prod/agent-hub:vercel_token`
# (and :vercel_preview_token) and copied into the GitHub environment secrets by hand from vault
project = "agent-hub"
framework = "nextjs"
node = "24.x"
root_directory = "apps/hub"
domains = ["rc-agent-hub.vercel.app"]

[vault]
path = "secret/ai-tools/prod/agent-hub"
generate = ["service_tokens", "eve_jwt_secret", "cron_secret"]
bypass = "vercel_bypass"

[vault.copy]
"secret/ai-tools/prod/investigator-agent" = ["service_token", "semantic_engine_token"]

[[stores]]
kind = "neon"
name = "neon-agent-hub"

# one flags store per environment, so a preview flip never touches production
[[stores]]
kind = "edge-config"
name = "ai-platform-flags"
environments = ["production"]
[stores.items]
kill = { investigate = false }
require_ctx = false
jobs = { churn_report = { live = false }, churn_chat = { live = false }, churn_suggestions = { live = false } }

[[stores]]
kind = "edge-config"
name = "ai-platform-flags-preview"
environments = ["preview"]
[stores.items]
kill = { investigate = false }
require_ctx = false
jobs = { churn_report = { live = true }, churn_chat = { live = true }, churn_suggestions = { live = true } }
