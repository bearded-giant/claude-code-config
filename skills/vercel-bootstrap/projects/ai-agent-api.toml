# ai-platform front door (apps/agent-api in RechargePayments/ai-platform); GitHub Actions deploys, so no gitlab key:
# the deploy tokens are minted with `vbs.py token ai-agent-api --vault secret/ai-tools/prod/ai-agent-api:vercel_token`
# (and :vercel_preview_token) and copied into the GitHub environment secrets by hand from vault
project = "ai-agent-api"
framework = "hono"
node = "24.x"
root_directory = "apps/agent-api"
function_timeout = 800
domains = ["rc-ai-agent-api.vercel.app"]

[vault]
path = "secret/ai-tools/prod/ai-agent-api"
generate = ["token_script", "ctx_pepper_production", "ctx_pepper_preview"]
bypass = "vercel_bypass"

[vault.copy]
"secret/ai-tools/prod/investigator-agent" = ["service_token:investigator_token"]
